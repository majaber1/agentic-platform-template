services:
  model-router:
    image: ghcr.io/berriai/litellm:v1.100.1
    command:
      - "--config=/app/config.yaml"
      - "--port=4000"
    env_file:
      - .env.router
    volumes:
      - ./config/litellm/config.v05.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
