name: v0.5 Stabilization

on:
  push:
    branches: [v0.5-open-source-first]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORGE_SHA: 048fdc658527b0dd60babbb65ee5729e3af1a79d
  LITELLM_IMAGE: ghcr.io/berriai/litellm:v1.100.1

jobs:
  forge-stabilization:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout template branch
        uses: actions/checkout@v4

      - name: Checkout pinned Forge upstream
        uses: actions/checkout@v4
        with:
          repository: nihalashetty/Forge
          ref: ${{ env.FORGE_SHA }}
          path: vendor/forge

      - name: Verify Forge source pin and dependency inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vendor/forge rev-parse HEAD)" = "$FORGE_SHA"
          sha256sum vendor/forge/apps/api/pyproject.toml | tee /tmp/forge-pyproject.sha256
          sha256sum vendor/forge/pnpm-lock.yaml | tee /tmp/forge-pnpm-lock.sha256
          grep -q "MIT License" vendor/forge/LICENSE

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: vendor/forge/apps/api/pyproject.toml

      - name: Install Forge backend and snapshot resolved Python graph
        working-directory: vendor/forge/apps/api
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          pip install -e ".[dev,all]"
          pip check | tee /tmp/forge-pip-check.txt
          pip freeze --all | sort > /tmp/forge-python-freeze.txt
          python - <<'PY'
          from pathlib import Path
          rows=Path('/tmp/forge-python-freeze.txt').read_text().splitlines()
          assert len(rows) >= 25, f'unexpectedly small resolved graph: {len(rows)}'
          print('PYTHON_RESOLUTION_SNAPSHOT_PASS', len(rows))
          PY

      - name: High-value failure-path and security suite
        working-directory: vendor/forge
        shell: bash
        env:
          FORGE_AUTH_REQUIRED: "false"
          FORGE_ALLOW_OPEN_SIGNUP: "true"
        run: |
          set -euo pipefail
          pytest -q \
            apps/api/tests/test_error_workflow.py \
            apps/api/tests/test_tool_reliability.py \
            apps/api/tests/test_ratelimit.py \
            apps/api/tests/test_tracer_interrupt.py \
            apps/api/tests/test_security_hardening.py \
            apps/api/tests/test_ssrf.py \
            apps/api/tests/test_tls_skip_verify.py \
            apps/api/tests/test_channels_hitl.py \
            | tee /tmp/forge-failure-path-tests.txt

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: vendor/forge/pnpm-lock.yaml

      - name: Verify frontend lockfile reproducibility
        working-directory: vendor/forge
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          git diff --exit-code -- pnpm-lock.yaml
          echo FRONTEND_LOCK_REPRODUCIBILITY_PASS | tee /tmp/frontend-lock.txt

      - name: Upload Forge stabilization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v05-stabilization-forge-evidence
          path: |
            /tmp/forge-pyproject.sha256
            /tmp/forge-pnpm-lock.sha256
            /tmp/forge-pip-check.txt
            /tmp/forge-python-freeze.txt
            /tmp/forge-failure-path-tests.txt
            /tmp/frontend-lock.txt
          if-no-files-found: ignore

  router-failure-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout template branch
        uses: actions/checkout@v4

      - name: Verify router config has no embedded provider secret values
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'os.environ/GROQ_API_KEY' config/litellm/config.v05.yaml
          grep -q 'os.environ/OPENROUTER_API_KEY' config/litellm/config.v05.yaml
          ! grep -Eq 'gsk_[A-Za-z0-9_-]{12,}|sk-or-[A-Za-z0-9_-]{12,}' config/litellm/config.v05.yaml
          echo ROUTER_SECRET_REFERENCE_POLICY_PASS | tee /tmp/router-secret-policy.txt

      - name: Boot pinned LiteLLM with dummy provider credentials
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$LITELLM_IMAGE"
          IMAGE_ID=$(docker image inspect "$LITELLM_IMAGE" --format '{{.Id}}')
          echo "$IMAGE_ID" | tee /tmp/litellm-image-id.txt
          docker run -d --name v05-router \
            -p 4000:4000 \
            -e GROQ_API_KEY=dummy-not-a-real-key \
            -e OPENROUTER_API_KEY=dummy-not-a-real-key \
            -e LITELLM_MASTER_KEY=sk-v05-stabilization-master \
            -v "$PWD/config/litellm/config.v05.yaml:/app/config.yaml:ro" \
            "$LITELLM_IMAGE" \
            --config=/app/config.yaml --port=4000
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4000/health/liveliness >/tmp/router-health.json; then
              cat /tmp/router-health.json
              exit 0
            fi
            sleep 2
          done
          docker logs v05-router
          exit 1

      - name: Router authentication failure path
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/router-unauthorized.json -w '%{http_code}' \
            http://127.0.0.1:4000/v1/models \
            -H 'Authorization: Bearer definitely-wrong-key')
          case "$STATUS" in
            401|403) ;;
            *) echo "Expected 401/403, got $STATUS"; cat /tmp/router-unauthorized.json; exit 1 ;;
          esac
          echo "ROUTER_UNAUTHORIZED_REJECTED_PASS $STATUS" | tee /tmp/router-auth-failure.txt

      - name: Router authorized catalog and unknown-model failure path
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:4000/v1/models \
            -H 'Authorization: Bearer sk-v05-stabilization-master' \
            > /tmp/router-models.json
          grep -q 'groq/' /tmp/router-models.json
          grep -q 'openrouter/' /tmp/router-models.json

          STATUS=$(curl -sS -o /tmp/router-unknown-model.json -w '%{http_code}' \
            http://127.0.0.1:4000/v1/chat/completions \
            -H 'Authorization: Bearer sk-v05-stabilization-master' \
            -H 'content-type: application/json' \
            -d '{"model":"provider-that-does-not-exist/v05","messages":[{"role":"user","content":"stabilization"}]}')
          if [ "$STATUS" -lt 400 ]; then
            echo "Unknown model unexpectedly succeeded with $STATUS"
            cat /tmp/router-unknown-model.json
            exit 1
          fi
          echo "ROUTER_UNKNOWN_MODEL_FAILS_CLOSED_PASS $STATUS" | tee /tmp/router-unknown-model-status.txt

      - name: Collect router logs
        if: always()
        shell: bash
        run: docker logs v05-router > /tmp/router.log 2>&1 || true

      - name: Upload router failure-path evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v05-stabilization-router-evidence
          path: |
            /tmp/router-secret-policy.txt
            /tmp/litellm-image-id.txt
            /tmp/router-health.json
            /tmp/router-unauthorized.json
            /tmp/router-auth-failure.txt
            /tmp/router-models.json
            /tmp/router-unknown-model.json
            /tmp/router-unknown-model-status.txt
            /tmp/router.log
          if-no-files-found: ignore
