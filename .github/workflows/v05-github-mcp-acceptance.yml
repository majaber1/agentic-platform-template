name: v0.5 GitHub MCP Acceptance

on:
  push:
    branches: [v0.5-open-source-first]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  FORGE_SHA: 048fdc658527b0dd60babbb65ee5729e3af1a79d
  GITHUB_MCP_IMAGE: ghcr.io/github/github-mcp-server:v1.12.1
  FORGE_ENVIRONMENT: development
  FORGE_AUTH_REQUIRED: "true"
  FORGE_ALLOW_OPEN_SIGNUP: "false"
  FORGE_JWT_SECRET: acceptance-only-jwt-secret-change-me-1234567890
  FORGE_BOOTSTRAP_ADMIN_EMAIL: acceptance@forge.local
  FORGE_BOOTSTRAP_ADMIN_PASSWORD: AcceptancePass123!
  FORGE_DEFAULT_MODEL: fake:echo
  FORGE_ENABLE_MCP_STDIO: "true"
  FORGE_MCP_STDIO_ALLOWED_COMMANDS: docker
  GITHUB_PERSONAL_ACCESS_TOKEN: ${{ github.token }}

jobs:
  github-mcp-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout template branch
        uses: actions/checkout@v4

      - name: Checkout pinned Forge upstream
        uses: actions/checkout@v4
        with:
          repository: nihalashetty/Forge
          ref: ${{ env.FORGE_SHA }}
          path: vendor/forge

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: vendor/forge/apps/api/pyproject.toml

      - name: Install Forge backend
        working-directory: vendor/forge/apps/api
        run: python -m pip install -U pip && pip install -e ".[dev,all]"

      - name: Pull official GitHub MCP image
        run: |
          docker pull "$GITHUB_MCP_IMAGE"
          docker inspect "$GITHUB_MCP_IMAGE" --format '{{index .RepoDigests 0}}' | tee /tmp/github-mcp-image.txt

      - name: Start Forge API with bounded MCP stdio
        working-directory: vendor/forge/apps/api
        shell: bash
        run: |
          nohup uvicorn forge.main:app --host 127.0.0.1 --port 8000 > /tmp/forge-api.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/readyz >/tmp/ready.json; then cat /tmp/ready.json; exit 0; fi
            sleep 2
          done
          cat /tmp/forge-api.log
          exit 1

      - name: Register official GitHub MCP and verify bounded discovery
        shell: bash
        run: |
          python - <<'PY'
          import json, httpx
          base='http://127.0.0.1:8000'
          login=httpx.post(f'{base}/v1/auth/login', json={
              'email':'acceptance@forge.local','password':'AcceptancePass123!'
          }, timeout=20)
          login.raise_for_status()
          h={'Authorization': f"Bearer {login.json()['access_token']}"}
          p=httpx.post(f'{base}/v1/projects', json={'name':'v0.5 GitHub MCP Acceptance'}, headers=h, timeout=20)
          p.raise_for_status(); project=p.json(); pid=project['id']
          client_payload={
              'name':'github-official-readonly',
              'transport':'stdio',
              'command':'docker',
              'args':{'args':[
                  'run','-i','--rm',
                  '-e','GITHUB_PERSONAL_ACCESS_TOKEN',
                  'ghcr.io/github/github-mcp-server:v1.12.1',
                  'stdio','--read-only',
                  '--tools=get_file_contents,pull_request_read,get_me'
              ]}
          }
          c=httpx.post(f'{base}/v1/projects/{pid}/mcp-clients', json=client_payload, headers=h, timeout=20)
          c.raise_for_status(); client=c.json(); cid=client['id']
          d=httpx.get(f'{base}/v1/projects/{pid}/mcp-clients/{cid}/tools', headers=h, timeout=90)
          d.raise_for_status(); discovery=d.json()
          assert discovery.get('ok') is True, discovery
          tools=discovery.get('tools') or []
          names={t.get('name') for t in tools}
          assert {'get_file_contents','pull_request_read','get_me'} <= names, names
          assert not any(n in names for n in {'create_or_update_file','delete_file','create_pull_request','merge_pull_request'}), names
          json.dump({'project':project,'client':client,'tools':discovery}, open('/tmp/github-mcp-registration.json','w'), indent=2)
          json.dump(discovery, open('/tmp/github-mcp-tools.json','w'), indent=2)
          print('GITHUB_MCP_DISCOVERY_PASS', cid, sorted(names))
          PY

      - name: Invoke real GitHub tool through Forge MCP adapter
        working-directory: vendor/forge/apps/api
        shell: bash
        run: |
          python - <<'PY'
          import asyncio, json
          from types import SimpleNamespace
          from forge.tools.mcp import server_tools, close_all

          reg=json.load(open('/tmp/github-mcp-registration.json'))
          p=reg['project']; c=reg['client']
          row=SimpleNamespace(
              id=c['id'], name=c['name'], transport=c['transport'], url=c.get('url'),
              command=c.get('command'), args=c.get('args') or {}, headers_ref=c.get('headers_ref'),
              auth_provider_id=c.get('auth_provider_id'), disabled_tools=c.get('disabled_tools') or []
          )

          async def main():
              tools=await server_tools(row, p.get('tenant_id') or 'default', p['id'], {})
              names={t.name for t in tools}
              assert 'get_file_contents' in names, names
              tool=next(t for t in tools if t.name=='get_file_contents')
              out=await tool.ainvoke({
                  'owner':'majaber1','repo':'agentic-platform-template',
                  'path':'README.md','ref':'v0.5-open-source-first'
              })
              text=str(out)
              open('/tmp/github-mcp-result.txt','w').write(text)
              assert 'Agentic Platform Template' in text, text[:4000]
              assert 'open-source-first' in text, text[:4000]
              print('FORGE_GITHUB_MCP_TOOL_INVOKE_PASS', len(text))
              await close_all()
          asyncio.run(main())
          PY

      - name: Verify Forge agent can attach the MCP server natively
        shell: bash
        run: |
          python - <<'PY'
          import json, httpx
          base='http://127.0.0.1:8000'
          login=httpx.post(f'{base}/v1/auth/login', json={
              'email':'acceptance@forge.local','password':'AcceptancePass123!'
          }, timeout=20)
          login.raise_for_status(); h={'Authorization': f"Bearer {login.json()['access_token']}"}
          reg=json.load(open('/tmp/github-mcp-registration.json'))
          pid=reg['project']['id']; cid=reg['client']['id']
          wf={
              'id':'v05_github_mcp_agent_attach','version':1,
              'state':{'messages':{'type':'list[message]','reducer':'add_messages'}},
              'entry_node':'agent',
              'nodes':[
                  {'id':'agent','type':'agent','config':{
                      'flavor':'agent','model':'fake:MCP agent attachment PASS',
                      'tools':[],'mcp_servers':[cid]
                  }},
                  {'id':'end','type':'end','config':{}}
              ],
              'edges':[{'source':'agent','target':'end'}]
          }
          w=httpx.post(f'{base}/v1/projects/{pid}/workflows', json={
              'name':'GitHub MCP Agent Attachment','description':'Native Forge agent mcp_servers path','executable':wf
          }, headers=h, timeout=20)
          assert w.status_code==201,w.text; wid=w.json()['id']
          q=httpx.patch(f'{base}/v1/projects/{pid}', json={'config':{'api_workflow_id':wid,'default_model':'fake:echo'}}, headers=h, timeout=20)
          q.raise_for_status()
          r=httpx.post(f'{base}/v1/projects/{pid}/run', json={
              'input':{'messages':[{'role':'user','content':'Verify MCP attachment.'}]},'stream':False
          }, headers=h, timeout=120)
          r.raise_for_status(); out=r.json()
          assert out.get('status')=='done',out
          assert 'MCP agent attachment PASS' in (out.get('answer') or ''),out
          json.dump(out, open('/tmp/github-mcp-agent-run.json','w'), indent=2)
          traces=httpx.get(f'{base}/v1/projects/{pid}/traces', headers=h, timeout=20)
          traces.raise_for_status(); rows=traces.json(); assert rows,rows
          detail=httpx.get(f'{base}/v1/projects/{pid}/traces/{rows[0]["id"]}', headers=h, timeout=20)
          detail.raise_for_status(); json.dump(detail.json(), open('/tmp/github-mcp-trace.json','w'), indent=2)
          print('FORGE_AGENT_MCP_ATTACHMENT_PASS', cid, wid)
          PY

      - name: Collect GitHub MCP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v05-github-mcp-evidence
          path: |
            /tmp/ready.json
            /tmp/forge-api.log
            /tmp/github-mcp-image.txt
            /tmp/github-mcp-registration.json
            /tmp/github-mcp-tools.json
            /tmp/github-mcp-result.txt
            /tmp/github-mcp-agent-run.json
            /tmp/github-mcp-trace.json
          if-no-files-found: ignore
